# Build acceleration: sccache compiler cache + mold linker.
# Requires `mold` and `sccache` on PATH (e.g. `pacman -S mold sccache`).
# Bypass per-build with `CARGO_BUILD_RUSTC_WRAPPER= cargo …` (skip sccache)
# or `RUSTFLAGS= cargo …` (skip mold); see AGENTS.md "Build acceleration".
[build]
rustc-wrapper = "sccache"

# GCC 16 warns by default on system Qt 6 headers (qchar.h, QTBUG-143470).
# This cannot be a rustflag: target rustflags replace [build] rustflags, and
# rustc rejects -Wno-*. The cc crate forwards CXXFLAGS last on every C++
# compile, including cxx-qt-lib. -Wall/-Wextra put back cc's own defaults,
# which it skips once CXXFLAGS is set.
[env]
CXXFLAGS = "-Wall -Wextra -Wno-sfinae-incomplete"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
